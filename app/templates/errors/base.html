<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123c69">
    <title>{% block title %}Smart Class Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body class="bg-body-tertiary">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header>
      <nav class="navbar navbar-dark app-navbar" aria-label="Error page navigation">
        <div class="container-xl">
          <span class="navbar-brand">
            <span class="brand-school">College Saint André</span>
            <span class="brand-app">Smart Class Management System</span>
          </span>
        </div>
      </nav>
    </header>
    <main id="main-content" class="container-xl py-5" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="container-xl pb-4 text-center text-body-secondary small">College Saint André · Smart Class Management System</footer>
  </body>
</html>
